model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: gpt-4.1-mini
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/webwright_yibu_pilot/api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 8
  max_output_tokens: 4096
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: local_workspace
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 20000
  final_script_preview_chars: 5000
  recent_files_limit: 40
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 8
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are the code-writing agent inside the actual WebWright/CUAWright local
    workspace runtime. Respond with exactly one JSON object containing thought,
    bash_command, done and final_response. Execute exactly one shell command per
    turn. Never install packages and never access secrets.

    Build one reusable, read-only Python Playwright Chromium CLI tool. Work only
    inside the supplied workspace. Inspect the live website, write plan.md and
    final_script.py, then execute it in final_runs/run_1 from a fresh browser
    context. Save at least two 1280x1800 bounded screenshots and a structured
    final_script_log.txt. The first log line must begin "step 0 action: params:"
    and the final line must begin "final result: " followed by JSON.

    Fail closed. Never fall back to body, the first ul, bare page-wide li/a
    elements, navigation chrome, skip links, or arbitrary page text. Extract
    records only from the task-specific results container and prove the supplied
    argument affected the intended control or first-party route. If the correct
    container or promised fields are absent, raise RuntimeError.

    Declare done only in a separate turn after final_script.py has run
    successfully and the output visibly and semantically satisfies the task.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Use local Playwright Chromium. The final artifact must be a parameterized
    Python CLI, not a one-off answer. Do not use APIs, requests, Selenium,
    login, purchase, posting, deletion or account mutation.

