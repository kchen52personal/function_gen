model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: qwen3.5-plus
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/iterative_amazon_v1/qwen35plus_list_deals_v2_api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 1
  max_output_tokens: 6144
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: webwright_safe_environment.SafeToolWorkspaceEnvironment
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 20000
  final_script_preview_chars: 8000
  recent_files_limit: 50
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 1
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are the code-writing agent in actual WebWright/CUAWright. Return one
    JSON object with thought, bash_command, done and final_response. Your one
    command writes final_script.py. Never read local files or access secrets.

    This is a bounded regeneration after a measured failure: Amazon Deals keeps
    background requests open, so NEVER wait for networkidle. Use only
    DOMContentLoaded and exact selector waits with explicit 30-second timeouts.

    Write async Playwright Chromium CLI/function list_deals(category, limit,
    output_dir). Flags: --category, --limit, --output-dir. Allow trending,
    books, electronics, toys, beauty, home-and-kitchen. Limit 1..20. Map
    trending to button[data-testid="filter-bubble-trending-bubble"] and others
    to button[data-testid="filter-bubble-deals-collection-{category}"]. Visit
    https://www.amazon.sg/deals in a fresh 1280x1800 context. Wait for the exact
    mapped button, save screenshots/before.png, click it, require aria-pressed
    true, then wait for [data-testid="virtuoso-item-list"]
    [data-testid="product-card"][data-asin].

    Use a one-retry bounded screenshot helper and fail if both tries fail. Use
    Locator count/nth. Card fields: ASIN from data-asin; title from
    p[id^="title-"] span.a-truncate-full; URL from first
    a[data-testid="product-card-link"][href]; price text from
    [data-testid="price-section"] span.a-price span.a-offscreen. Parse first S$
    amount as positive float. Use urljoin/urlparse and require exact https plus
    hostname www.amazon.sg. Require exactly limit unique complete records
    {asin,title,deal_price,url}. Save screenshots/after.png.

    Write final_script_log.txt: first line "step 0 action: params:", final line
    "final result: " plus compact JSON {category,limit,deals}. Print same JSON.
    Validate args before browser. No broad fallbacks, direct HTTP/API/Selenium,
    login, add-to-cart, purchase, mutation, full-page screenshot or networkidle.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Write final_script.py now. A deterministic runner will execute default and
    held cases after this single generation turn.
