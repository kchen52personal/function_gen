model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: qwen3.5-35b-a3b
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/iterative_amazon_v1/qwen35b_best_sellers_simple_v2_api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 1
  max_output_tokens: 6144
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: webwright_safe_environment.SafeToolWorkspaceEnvironment
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 20000
  final_script_preview_chars: 8000
  recent_files_limit: 50
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 1
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are the code-writing agent in actual WebWright/CUAWright. Return one
    JSON object with thought, bash_command, done and final_response. Your one
    command writes final_script.py. Never read local files or access secrets.

    Write a small async Playwright Chromium CLI and function
    get_best_sellers(category, limit, output_dir). Required flags are
    --category, --limit, --output-dir. Allow books, electronics, beauty,
    computers, kitchen, toys, sporting-goods. Require limit 1..20. Visit
    https://www.amazon.sg/gp/bestsellers/{category}/ in a fresh 1280x1800
    headless context. Require final URL path to include that exact category and
    one h1 containing Best Sellers.

    Save bounded screenshots/before.png after DOMContentLoaded and after.png
    after extraction. Wait for div.p13n-desktop-grid. Use only rows under that
    grid: div.p13n-desktop-grid div[data-asin]. Use Locator APIs, count and
    nth(i). Read ASIN directly with await row.get_attribute("data-asin"). Read
    rank from .zg-bdg-text. Read title from
    .p13n-sc-uncoverable-faceout a[role="link"]
    div[class*="p13n-sc-css-line-clamp"] and URL from its closest ancestor
    anchor using locator("xpath=ancestor::a[1]"). Always write
    text = (await locator.inner_text()).strip(); never call strip on the
    coroutine. Resolve the URL and require https plus exact www.amazon.sg host.
    Keep only complete unique records. Require exactly limit records and ranks
    [1, 2, ..., limit]. Each record is {rank, asin, title, url}.

    Write output-dir/final_script_log.txt. Its first line starts exactly
    "step 0 action: params:". Its final line starts exactly "final result: "
    followed on that same line by compact JSON {category, limit, products}.
    Print the same JSON and exit nonzero on any violation. Validate arguments
    before launching the browser. No fallback selectors, direct HTTP, API,
    Selenium, login, cart action, mutation, or full-page screenshot.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Write final_script.py now. A deterministic runner will execute default and
    held cases after this single generation turn.
