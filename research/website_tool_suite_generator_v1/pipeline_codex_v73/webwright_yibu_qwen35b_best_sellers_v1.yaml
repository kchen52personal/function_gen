model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: qwen3.5-35b-a3b
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/iterative_amazon_v1/qwen35b_best_sellers_v1_api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 1
  max_output_tokens: 8192
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: webwright_safe_environment.SafeToolWorkspaceEnvironment
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 24000
  final_script_preview_chars: 8000
  recent_files_limit: 50
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 1
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are the code-writing agent in actual WebWright/CUAWright. Return one
    JSON object with thought, bash_command, done and final_response. Your one
    command must write final_script.py. Never install software, read local
    files, or access secrets. Use only the public contract and selectors below.

    Write a standalone async Playwright Chromium CLI and reusable function
    get_best_sellers(category, limit, output_dir). Required CLI flags are
    --category, --limit, --output-dir. Allow categories books, electronics,
    beauty, computers, kitchen, toys and sporting-goods. Require limit 1..20.
    Navigate directly to https://www.amazon.sg/gp/bestsellers/{category}/ in a
    fresh headless context at viewport 1280x1800. This is public read-only.

    Save output-dir/screenshots/before.png after DOMContentLoaded, then wait for
    div.p13n-desktop-grid div[data-asin]. Use Locator APIs consistently. For
    each product row, get ASIN from the row itself with await
    row.get_attribute("data-asin"); rank from .zg-bdg-text; title from
    .p13n-sc-uncoverable-faceout a[role="link"]
    div[class*="p13n-sc-css-line-clamp"] and the URL from that title div's
    nearest ancestor a; price from span[class*="p13n-sc-price"] or, within the
    same row only, span.a-price span.a-offscreen; rating from span.a-icon-alt.
    Await every async method and check optional locator counts before reading.
    Parse rank to integer, price to a positive float and first decimal rating
    to 0..5. Resolve URLs against https://www.amazon.sg and require parsed
    scheme https plus exact hostname www.amazon.sg. Skip incomplete records,
    stop at limit, require exactly limit unique ASINs and ranks 1..limit.
    Require page URL path to contain /gp/bestsellers/{category} and the page h1
    to contain Best Sellers. Never use page-wide fallbacks.

    Save a bounded after.png. Write final_script_log.txt whose first line begins
    "step 0 action: params:" and final line begins "final result: " followed by
    JSON {category, limit, products}; products contain rank, asin, title, price,
    rating, url. Print the same JSON. Fail nonzero on missing artifacts or any
    contract violation. No full-page screenshot, direct HTTP, API, Selenium,
    login, cart action or mutation.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Write final_script.py now. Deterministic stages will execute default and
    held cases after this one generation turn.
