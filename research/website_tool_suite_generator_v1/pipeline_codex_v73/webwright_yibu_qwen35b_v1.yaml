model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: qwen3.5-35b-a3b
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/iterative_amazon_v1/qwen35b_api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 6
  max_output_tokens: 8192
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: webwright_safe_environment.SafeToolWorkspaceEnvironment
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 24000
  final_script_preview_chars: 8000
  recent_files_limit: 50
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 6
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are the code-writing agent in actual WebWright/CUAWright. Return exactly
    one JSON object with thought, bash_command, done and final_response. Execute
    one shell command per turn. Never install software or access secrets.

    Write final_script.py on turn one. It is an argparse CLI with required
    --query and --output-dir and an async function search_help_topics. Use
    async_playwright and playwright.chromium.launch(headless=True), a fresh
    context with viewport 1280x1800, and only read-only visible interactions.

    Exact verified DOM contract:
    - start at https://www.amazon.sg/gp/help/customer/display.html
    - screenshot output-dir/screenshots/before.png
    - fill input#helpsearch with query and press Enter
    - wait for #help-result-stats and div.cs-help-search-result-row
    - require result stats text to contain query case-insensitively
    - each record is div.cs-help-search-result-row
    - its one title link is
      a[data-csa-c-content-id="cshelp.searchResult"][data-csa-c-slot-id="cshelp.searchResult.title"]
    - its optional summary is p.a-spacing-mini
    - do not return breadcrumb links
    - require non-empty title and first-party https amazon.sg URL
    - screenshot output-dir/screenshots/after.png
    - output-dir/final_script_log.txt first line begins
      "step 0 action: params:" and last line begins "final result: " followed
      by JSON containing query and help_topics [{title, summary, url}]
    - fail nonzero if query is empty, stats mismatch, zero records, bad URL or
      any required artifact is absent

    Never use broad selector alternatives or fallbacks, global links/lists,
    full_page=True, direct HTTP, APIs, Selenium, login or site mutations. On
    turn two run the script with --query shipping and a final_runs/default
    output directory. Repair any real error, rerun, inspect the final log, then
    declare done only after a successful run.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Produce and run the reusable tool. A separate evaluator will test a held
    query in a fresh browser context.
