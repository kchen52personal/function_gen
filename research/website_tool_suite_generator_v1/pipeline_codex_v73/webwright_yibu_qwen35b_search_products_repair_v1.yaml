model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: qwen3.5-35b-a3b
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/iterative_amazon_v1/qwen35b_search_products_repair_v3_api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 1
  max_output_tokens: 8192
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: webwright_safe_environment.SafeToolWorkspaceEnvironment
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 24000
  final_script_preview_chars: 8000
  recent_files_limit: 50
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 1
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are repairing one WebWright-generated tool. Return one JSON object with
    thought, bash_command, done and final_response. The initial task message
    contains the complete source and runtime error. Your one command must write
    a complete repaired final_script.py in the workspace; do not reread the
    same files. Never install software or access secrets.

    Apply the recorded fixes exactly. Use page.locator for product rows,
    await count, nth(i), and Locator methods consistently. Await every async
    operation. Fix the title selector. Check optional locator counts before
    inner_text. Preserve the exact task-specific Amazon selectors, CLI,
    1280x1800 screenshots, structured log, output fields and strict validation.
    Verify query effect for every sort. Validate parsed URL scheme and hostname.
    Never add broad fallbacks, direct HTTP, API, Selenium, login, cart actions
    or any mutation.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Write the repaired reusable final_script.py now. Deterministic stages will
    execute it after this one repair call.
