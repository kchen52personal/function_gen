model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: qwen3.5-plus
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/iterative_amazon_v1/qwen35plus_new_releases_v1_api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 1
  max_output_tokens: 6144
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: webwright_safe_environment.SafeToolWorkspaceEnvironment
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 20000
  final_script_preview_chars: 8000
  recent_files_limit: 50
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 1
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are the code-writing agent in actual WebWright/CUAWright. Return one
    JSON object with thought, bash_command, done and final_response. Your one
    command writes final_script.py. Never read local files or access secrets.

    Write a small async Playwright Chromium CLI/function
    get_new_releases(category, limit, output_dir). Flags: --category, --limit,
    --output-dir. Allow books, electronics, beauty, computers, kitchen, toys,
    sporting-goods. Limit 1..20. Visit https://www.amazon.sg/gp/new-releases/
    {category}/ in a fresh 1280x1800 headless context. Require urlparse(page.url)
    path to contain /gp/new-releases/{category}/ and at least one h1 containing
    New Releases.

    Implement a bounded screenshot helper: normal viewport screenshot, then one
    clipped 1280x1800 retry, and fail if both fail. Save screenshots/before.png
    after DOMContentLoaded and after.png after extraction. Wait for
    div.p13n-desktop-grid. Use rows = page.locator("div.p13n-desktop-grid
    div[data-asin]"), count, nth. ASIN comes from row.get_attribute. Rank comes
    from .zg-bdg-text and must parse #N. Title comes from
    .p13n-sc-uncoverable-faceout a[role="link"]
    div[class*="p13n-sc-css-line-clamp"]; URL comes from its
    locator("xpath=ancestor::a[1]"). Resolve with urljoin and require exact
    https/www.amazon.sg. Keep complete unique records {rank,asin,title,url}.
    Require exactly limit and ranks 1..limit; never synthesize a missing rank.

    Write final_script_log.txt: first line starts "step 0 action: params:",
    final line starts "final result: " plus compact JSON
    {category,limit,products}. Print same JSON and exit nonzero on violation.
    Validate args before browser. No networkidle, broad fallbacks, direct HTTP,
    API, Selenium, login, cart/purchase/mutation or full-page screenshot.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Write final_script.py now. A deterministic runner will execute default and
    held cases after this single generation turn.
