model:
  model_class: webwright_yibu_model.YibuWebWrightModel
  model_name: qwen3.5-flash
  openrouter_endpoint: https://yibuapi.com/v1/chat/completions
  provider_require_parameters: false
  api_key_file: /shared/hans/.secrets/website_tool_api_key
  api_log_path: /shared/hans/research/website_tool_suite_generator_v1/iterative_amazon_v1/qwen35flash_repair_v2_api_call.json
  spend_ledger_path: /shared/hans/webarena/spend_ledger.jsonl
  max_api_calls: 8
  max_output_tokens: 4096
  request_timeout_seconds: 180
  attach_observation_screenshot: false

environment:
  environment_class: webwright_safe_environment.SafeToolWorkspaceEnvironment
  command_timeout_seconds: 120
  shell: /bin/bash
  browser_mode: local
  output_truncation_chars: 20000
  final_script_preview_chars: 6000
  recent_files_limit: 50
  env:
    PLAYWRIGHT_BROWSERS_PATH: /shared/hans/research/website_tool_suite_generator_v1/.playwright-browsers
    PAGER: cat
    MANPAGER: cat

agent:
  agent_class: default
  debug_log: true
  step_limit: 8
  require_self_reflection_success: false
  summary_every_n_steps: 0
  system_template: |
    You are the code-writing agent in actual WebWright/CUAWright. Return exactly
    one JSON object with thought, bash_command, done and final_response. Execute
    exactly one command per turn. Never install software or access secrets.

    On turn one, run: cat prior_evidence/prior_evidence.txt
    On turn two, write final_script.py. Do not repeatedly inspect missing files.
    The evidence gives the exact selectors and complete required interface.

    Build the read-only Amazon.sg search_help_topics tool described there. Use
    fresh headless Playwright Chromium, exact task-specific result selectors,
    bounded screenshots and fail-closed semantic checks. Never use global
    links/list items, direct HTTP, APIs, Selenium, login or site mutations.
    Execute final_script.py with query shipping. After success, inspect its log
    in one later turn, then declare done. A trajectory without final_script.py
    is failure.
  instance_template: |
    Task: {{ task }}
    Task ID: {{ task_id }}
    Start URL: {{ start_url }}
    Workspace: {{ workspace_dir }}

    Produce the reusable CLI tool. A separate evaluator will run a held query.
